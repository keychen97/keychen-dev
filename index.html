<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>keychen.dev — Key Chen 技術作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1F2328',
          muted: '#57606A',
          rule: '#D8DEE4',
          softrule: '#EAEEF2',
          chip: '#F6F8FA',
          accent: '#0066CC',
          accentDeep: '#0052A3',
          accentSoft: '#E6F0FB',
          parchment: '#FBFBFA',
        },
        fontFamily: {
          sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          serif: ['"IBM Plex Serif"', 'Georgia', 'serif'],
        },
        maxWidth: {
          'wiki': '1180px',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #ffffff; color: #1F2328; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wiki-link { color: #0066CC; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .15s ease; }
  .wiki-link:hover { border-bottom-color: #0066CC; }
  .wiki-link.visited { color: #0B5394; }
  .prose-wiki h2 { font-family: 'IBM Plex Serif', Georgia, serif; font-weight: 500; font-size: 1.5rem; line-height: 1.3; border-bottom: 1px solid #D8DEE4; padding-bottom: .35rem; margin-top: 2.5rem; margin-bottom: 1rem; scroll-margin-top: 90px; }
  .prose-wiki h3 { font-family: 'IBM Plex Serif', Georgia, serif; font-weight: 500; font-size: 1.15rem; margin-top: 1.75rem; margin-bottom: .6rem; scroll-margin-top: 90px; }
  .prose-wiki p { margin-bottom: 1rem; line-height: 1.75; color: #1F2328; text-wrap: pretty; }
  .prose-wiki ul { margin-bottom: 1rem; padding-left: 1.25rem; list-style: disc; }
  .prose-wiki ul li { margin-bottom: .35rem; line-height: 1.7; }
  .prose-wiki a { color: #0066CC; }
  .prose-wiki a:hover { text-decoration: underline; }
  .dotgrid { background-image: radial-gradient(#D8DEE4 1px, transparent 1px); background-size: 16px 16px; background-position: 0 0; }
  .stripe-placeholder { background-image: repeating-linear-gradient(135deg, #F6F8FA, #F6F8FA 10px, #EAEEF2 10px, #EAEEF2 20px); }
  .toc-link[data-active="true"] { color: #0066CC; border-left-color: #0066CC; background: #F6F8FA; }
  ::selection { background: #CFE3F7; color: #1F2328; }
  /* hide scrollbar in screenshots row but keep functionality */
  .scroll-x::-webkit-scrollbar { height: 8px; }
  .scroll-x::-webkit-scrollbar-thumb { background: #D8DEE4; border-radius: 4px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="js/data.jsx"></script>
<script type="text/babel" src="js/components.jsx"></script>
<script type="text/babel" src="js/pages.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
